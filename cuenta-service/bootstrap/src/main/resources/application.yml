spring:
  application:
    name: ${APP_NAME:cuenta-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    # Must stay below the orchestrator grace period, or in-flight requests are killed mid-drain.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuenta_db}
    username: ${SPRING_DATASOURCE_USERNAME:cuenta_app}
    password: ${SPRING_DATASOURCE_PASSWORD:cuenta_app}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
  jpa:
    hibernate:
      ddl-auto: none # schema is owned by Liquibase
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: ${SPRING_LIQUIBASE_CHANGELOG:classpath:/changelog/db.changelog-master.yaml}
    # Own connection on purpose: migrations run with a DDL user, the app with a DML-only one.
    url: ${SPRING_LIQUIBASE_URL:${spring.datasource.url}}
    user: ${SPRING_LIQUIBASE_USER:cuenta_owner}
    password: ${SPRING_LIQUIBASE_PASSWORD:cuenta_owner}
    # "demo" loads the sample customers of the exercise; leave empty to start with no data.
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:demo}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:cuenta-service}
      # A new consumer group replays the topic from the start, rebuilding the client projection.
      auto-offset-reset: earliest
    producer:
      # Only used to publish poison messages to the dead-letter topic.
      acks: all
    listener:
      # Offsets are committed only after the projection transaction committed.
      ack-mode: manual
      observation-enabled: true
  data:
    redis:
      # Valkey speaks the Redis protocol; Spring Data Redis + Lettuce connect unchanged.
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Idempotency checks sit on the request path: fail fast instead of holding the HTTP thread.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:200ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}

server:
  port: ${SERVER_PORT:8082}
  servlet:
    # The exercise fixes the public contract as http://{host}:{port}/api/{resource}.
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}
  shutdown: graceful
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    # Publishes openapi/cuenta-service.yaml (see OpenApiConfig), so the version must match the contract.
    version: openapi_3_0
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    # Turn off in production environments (api-design.md: Swagger UI in non-prod only).
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  show-actuator: false

management:
  # Actuator lives on its own port so it is never published next to the API.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9082}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        # Liveness ignores dependencies: a database outage must stop traffic, not restart the pod in a loop.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.devsu.bank: ${LOG_LEVEL_APP:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %-5level %logger{5} - %msg%n"
  # Containers ship stdout only (no log file); JSON is switched on per environment, e.g. LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash.
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
    json:
      add:
        application: ${spring.application.name}
        environment: ${SPRING_PROFILES_ACTIVE:default}
      stacktrace:
        max-length: 4096
        include-hashes: true

cuenta:
  reporte:
    zona: ${CUENTA_REPORTE_ZONA:America/Guayaquil}
  idempotency:
    key-prefix: ${CUENTA_IDEMPOTENCY_KEY_PREFIX:idem:movimiento:}
    # A retried request within this window replays the original movement instead of a new debit.
    ttl: ${CUENTA_IDEMPOTENCY_TTL:24h}
    # A reservation left by a crashed request frees the key after this long.
    in-progress-ttl: ${CUENTA_IDEMPOTENCY_IN_PROGRESS_TTL:1m}
  consumer:
    topic: ${CUENTA_CONSUMER_TOPIC:clientes.cliente.events}
    retry:
      initial-interval: ${CUENTA_CONSUMER_RETRY_INITIAL_INTERVAL:1s}
      multiplier: ${CUENTA_CONSUMER_RETRY_MULTIPLIER:2.0}
      # Then the record goes to <topic>.dlt and the partition moves on.
      max-retries: ${CUENTA_CONSUMER_RETRY_MAX_RETRIES:3}
