spring:
  application:
    name: cuenta-service
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:/changelog/db.changelog-master.yaml
    contexts: test

server:
  servlet:
    context-path: /api

management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ""

spring.kafka:
  consumer:
    group-id: cuenta-service-test
    auto-offset-reset: earliest
  listener:
    ack-mode: manual

cuenta:
  reporte:
    zona: America/Guayaquil
  idempotency:
    key-prefix: "idem:movimiento:"
    ttl: 24h
    in-progress-ttl: 1m
  consumer:
    topic: clientes.cliente.events
    retry:
      initial-interval: 100ms
      multiplier: 2.0
      max-retries: 2
