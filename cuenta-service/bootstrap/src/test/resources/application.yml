spring:
  application:
    name: cuenta-service
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:/changelog/db.changelog-master.yaml
    contexts: test

server:
  servlet:
    context-path: /api

management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ""
