# Build, test and coverage report. Copies the build and test jobs of the Codehunters
# java-pr-pipeline (java-build.yml + java-test.yml) so the repository is self-contained;
# the other stages of that pipeline (OWASP, Sonar, deploy) are out of scope here.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  COVERAGE_LINE_THRESHOLD: '80'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          # Build is the cache producer: the test job reuses its compile outputs.
          cache-read-only: false

      - name: Build (compile and package, no tests)
        run: ./gradlew assemble --no-daemon --build-cache --parallel

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon --build-cache

  test:
    name: Test and coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write  # coverage comment on the PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Pull the integration-test images
        shell: bash
        env:
          IMAGES: |
            postgres:17-alpine
            postgres:17.11-alpine
            apache/kafka-native:4.3.2
            valkey/valkey:9.0-alpine
        run: |
          set -euo pipefail
          qualified() { if [[ "$1" == */* ]]; then echo "$1"; else echo "library/$1"; fi; }
          pull() {
            local mirror
            docker pull --quiet "$1" && return 0
            for mirror in mirror.gcr.io public.ecr.aws/docker; do
              if docker pull --quiet "$mirror/$(qualified "$1")"; then
                docker tag "$mirror/$(qualified "$1")" "$1"
                return 0
              fi
            done
            echo "::error::could not pull $1"
            return 1
          }
          while read -r image; do
            [ -n "$image" ] || continue
            pull "$image"
          done <<< "$IMAGES"

      # `build` runs unit, integration (Testcontainers), ArchUnit and Karate tests, the
      # BaseDatos.sql drift check and the per-module JaCoCo gates (90% domain/application, 80% rest).
      - name: Run tests
        id: test-run
        run: |
          set +e
          ./gradlew build --no-daemon --build-cache --continue
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Parse test results
        id: test-summary
        if: always()
        shell: bash
        run: |
          PASSED=0; FAILED=0; SKIPPED=0
          while IFS= read -r -d '' file; do
            TESTS=$(grep -oP 'tests="\K[0-9]+' "$file" | head -1 || echo 0)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' "$file" | head -1 || echo 0)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' "$file" | head -1 || echo 0)
            SKIP=$(grep -oP 'skipped="\K[0-9]+' "$file" | head -1 || echo 0)
            FAILED=$((FAILED + FAILURES + ERRORS))
            SKIPPED=$((SKIPPED + SKIP))
            PASSED=$((PASSED + TESTS - FAILURES - ERRORS - SKIP))
          done < <(find . -path "*/build/test-results/*" -name "*.xml" -print0)
          {
            echo "### Test Results"
            echo ""
            echo "| Status | Count |"
            echo "|--------|-------|"
            echo "| Passed | $PASSED |"
            echo "| Failed | $FAILED |"
            echo "| Skipped | $SKIPPED |"
            echo "| **Total** | **$((PASSED + FAILED + SKIPPED))** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse coverage report
        id: coverage
        if: always()
        shell: bash
        run: |
          TOTAL_MISSED=0; TOTAL_COVERED=0
          ROWS=""
          while IFS= read -r CSV_FILE; do
            MODULE=$(echo "$CSV_FILE" | sed 's|^\./||;s|/build/.*||')
            MISSED=$(awk -F',' 'NR>1 {sum+=$8} END {print sum+0}' "$CSV_FILE")
            COVERED=$(awk -F',' 'NR>1 {sum+=$9} END {print sum+0}' "$CSV_FILE")
            if [ $((MISSED + COVERED)) -gt 0 ]; then
              PCT=$(awk "BEGIN {printf \"%.1f\", ($COVERED / ($MISSED + $COVERED)) * 100}")
              ROWS="${ROWS}| ${MODULE} | ${PCT}% | ${COVERED}/$((MISSED + COVERED)) |"$'\n'
            fi
            TOTAL_MISSED=$((TOTAL_MISSED + MISSED))
            TOTAL_COVERED=$((TOTAL_COVERED + COVERED))
          done < <(find . -path "*/build/reports/jacoco/*" -name "*.csv" | sort)
          COVERAGE=0
          if [ $((TOTAL_MISSED + TOTAL_COVERED)) -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($TOTAL_COVERED / ($TOTAL_MISSED + $TOTAL_COVERED)) * 100}")
          fi
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### Code Coverage"
            echo "**Line Coverage: ${COVERAGE}%** (threshold ${COVERAGE_LINE_THRESHOLD}%)"
            echo ""
            echo "| Module | Lines | Covered |"
            echo "|--------|-------|---------|"
            printf '%s' "$ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish JaCoCo report on the PR
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920  # v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: ${{ env.COVERAGE_LINE_THRESHOLD }}
          min-coverage-changed-files: ${{ env.COVERAGE_LINE_THRESHOLD }}
          title: Code Coverage Report
          update-comment: true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
            **/build/karate-reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Check test result
        if: always()
        env:
          EXIT_CODE: ${{ steps.test-run.outputs.exit_code }}
          COVERAGE: ${{ steps.coverage.outputs.percentage }}
        run: |
          echo "Line coverage: ${COVERAGE:-n/a}%"
          if [ "${EXIT_CODE:-1}" != "0" ]; then
            echo "::error::./gradlew build failed (tests or coverage gates); see the reports artifact"
            exit 1
          fi
