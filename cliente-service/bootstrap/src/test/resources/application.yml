spring:
  application:
    name: cliente-service
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:/changelog/db.changelog-master.yaml
    contexts: test

server:
  servlet:
    context-path: /api

springdoc:
  api-docs:
    version: openapi_3_0

management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ""

outbox:
  enabled: true
  batch-size: 50
  max-attempts: 3
  claim-ttl: 1m
  backoff:
    base-delay: 1s
    max-delay: 5s
  publisher:
    send-timeout: 5s
  task:
    fixed-delay: 1s
