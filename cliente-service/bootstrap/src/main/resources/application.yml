spring:
  application:
    name: ${APP_NAME:cliente-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    # Must stay below the orchestrator grace period, or in-flight requests are killed mid-drain.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cliente_db}
    username: ${SPRING_DATASOURCE_USERNAME:cliente_app}
    password: ${SPRING_DATASOURCE_PASSWORD:cliente_app}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
  jpa:
    hibernate:
      ddl-auto: none # schema is owned by Liquibase
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: ${SPRING_LIQUIBASE_CHANGELOG:classpath:/changelog/db.changelog-master.yaml}
    # Own connection on purpose: migrations run with a DDL user, the app with a DML-only one.
    url: ${SPRING_LIQUIBASE_URL:${spring.datasource.url}}
    user: ${SPRING_LIQUIBASE_USER:cliente_owner}
    password: ${SPRING_LIQUIBASE_PASSWORD:cliente_owner}
    # "demo" loads the sample customers of the exercise; leave empty to start with no data.
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:demo}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The outbox marks a row PUBLISHED only after every in-sync replica has it.
      acks: all
      properties:
        enable.idempotence: true
        # Bounded waits: a broker outage must fail the publish (and schedule a retry), not hang the dispatcher.
        max.block.ms: ${SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${SPRING_KAFKA_PRODUCER_PROPERTIES_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${SPRING_KAFKA_PRODUCER_PROPERTIES_DELIVERY_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    # The exercise fixes the public contract as http://{host}:{port}/api/{resource}.
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  # Actuator lives on its own port so it is never published next to the API.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        # Liveness ignores dependencies: a database outage must stop traffic, not restart the pod in a loop.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.devsu.bank: ${LOG_LEVEL_APP:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %-5level %logger{5} - %msg%n"
  # Containers ship stdout only (no log file); JSON is switched on per environment, e.g. LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash.
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
    json:
      add:
        application: ${spring.application.name}
        environment: ${SPRING_PROFILES_ACTIVE:default}
      stacktrace:
        max-length: 4096
        include-hashes: true

outbox:
  enabled: ${OUTBOX_ENABLED:true}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  # Then FAILED, which blocks later events of the same client until requeued.
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
  # Rows IN_FLIGHT longer than this are taken over from a crashed instance; keep it > batch-size x send-timeout.
  claim-ttl: ${OUTBOX_CLAIM_TTL:5m}
  backoff:
    base-delay: ${OUTBOX_BACKOFF_BASE_DELAY:30s}
    max-delay: ${OUTBOX_BACKOFF_MAX_DELAY:1h}
  publisher:
    send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:5s}
  task:
    # Safety-net poll; normal dispatch happens right after each commit.
    fixed-delay: ${OUTBOX_TASK_FIXED_DELAY:5s}
